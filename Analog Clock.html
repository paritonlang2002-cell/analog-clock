<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Analog Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(22, 30, 52, 0.88);
      --text: #f4f7ff;
      --muted: #929fbd;
      --accent: #8b9dff;
      --cyan: #68e5dc;
      --border: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(92, 111, 230, 0.19), transparent 42%),
        radial-gradient(ellipse at 100% 100%, rgba(61, 202, 193, 0.08), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    .header {
      margin-bottom: 28px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(104, 229, 220, 0.7);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 750;
      letter-spacing: -1.6px;
    }

    .subtitle {
      max-width: 440px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .clock-card {
      padding: clamp(18px, 5vw, 34px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .clock-wrap {
      position: relative;
      width: min(100%, 430px);
      margin: 0 auto;
      aspect-ratio: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .digital-time {
      margin-top: 10px;
      color: var(--text);
      font-size: clamp(32px, 7vw, 46px);
      font-weight: 650;
      letter-spacing: 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .divider {
      height: 1px;
      margin: 26px 0;
      background: var(--border);
    }

    .controls-heading {
      margin: 0 0 14px;
      color: #dbe3f7;
      font-size: 13px;
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .control-group {
      min-width: 0;
    }

    .control-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #131b30;
      color: var(--text);
    }

    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
    }

    .toggle-label {
      color: #dbe3f7;
      font-size: 13px;
    }

    .toggle-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toggle-btn {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--muted);
      font-size: 12px;
      transition: 0.2s;
    }

    .toggle-btn.active {
      border-color: rgba(139, 157, 255, 0.4);
      background: rgba(139, 157, 255, 0.13);
      color: #c8d0ff;
    }

    .footer {
      margin-top: 20px;
      color: #7784a2;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .clock-card {
        padding: 17px;
        border-radius: 22px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .toggle-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Analog Clock</h1>
      <p class="subtitle">
        A real-time analog clock with smooth hands, elegant markers, and customizable themes.
      </p>
    </header>

    <section class="clock-card" aria-label="Analog clock and settings">
      <div class="clock-wrap">
        <canvas
          id="clockCanvas"
          role="img"
          aria-label="Analog clock showing the current local time"
        ></canvas>
      </div>

      <div class="digital-time" id="digitalTime" aria-live="off">00:00:00</div>
      <div class="date" id="dateDisplay"></div>

      <div class="divider"></div>

      <h2 class="controls-heading">Personalize your clock</h2>

      <div class="controls">
        <div class="control-group">
          <label for="themeSelect">Clock theme</label>
          <select id="themeSelect">
            <option value="midnight">Midnight Blue</option>
            <option value="emerald">Emerald</option>
            <option value="sunset">Sunset</option>
            <option value="ivory">Classic Ivory</option>
          </select>
        </div>

        <div class="control-group">
          <label for="numberSelect">Dial numerals</label>
          <select id="numberSelect">
            <option value="arabic">1, 2, 3...</option>
            <option value="roman">I, II, III...</option>
            <option value="none">No numerals</option>
          </select>
        </div>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Clock details</span>
        <div class="toggle-options">
          <button class="toggle-btn active" id="secondsToggle" type="button" aria-pressed="true">
            Seconds hand
          </button>
          <button class="toggle-btn active" id="marksToggle" type="button" aria-pressed="true">
            Minute markers
          </button>
          <button class="toggle-btn active" id="glowToggle" type="button" aria-pressed="true">
            Soft glow
          </button>
        </div>
      </div>
    </section>

    <footer class="footer">
      Drawn entirely with HTML Canvas. The clock follows your device's local time.
    </footer>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("clockCanvas");
    const ctx = canvas.getContext("2d");

    const digitalTime = document.getElementById("digitalTime");
    const dateDisplay = document.getElementById("dateDisplay");
    const themeSelect = document.getElementById("themeSelect");
    const numberSelect = document.getElementById("numberSelect");
    const secondsToggle = document.getElementById("secondsToggle");
    const marksToggle = document.getElementById("marksToggle");
    const glowToggle = document.getElementById("glowToggle");

    const themes = {
      midnight: {
        face: "#111a2d",
        faceInner: "#17243a",
        rim: "#60719b",
        rimHighlight: "#a9b9ed",
        major: "#f2f5ff",
        minor: "#7787aa",
        hourHand: "#f4f6ff",
        minuteHand: "#8b9dff",
        secondHand: "#68e5dc",
        center: "#68e5dc",
        numeral: "#dce4fa",
        innerRing: "rgba(139, 157, 255, 0.2)",
        glow: "rgba(104, 229, 220, 0.32)"
      },
      emerald: {
        face: "#10251f",
        faceInner: "#16352b",
        rim: "#4b9c80",
        rimHighlight: "#a3e8c6",
        major: "#edfff5",
        minor: "#6baf93",
        hourHand: "#f1fff6",
        minuteHand: "#70e1b5",
        secondHand: "#d5ff8a",
        center: "#d5ff8a",
        numeral: "#d5f6e4",
        innerRing: "rgba(112, 225, 181, 0.18)",
        glow: "rgba(112, 225, 181, 0.3)"
      },
      sunset: {
        face: "#2b1824",
        faceInner: "#3c2030",
        rim: "#b86b81",
        rimHighlight: "#ffd0ae",
        major: "#fff5ef",
        minor: "#c78b99",
        hourHand: "#fff3e8",
        minuteHand: "#ffb58b",
        secondHand: "#ffe08a",
        center: "#ffe08a",
        numeral: "#ffe4d8",
        innerRing: "rgba(255, 181, 139, 0.18)",
        glow: "rgba(255, 181, 139, 0.3)"
      },
      ivory: {
        face: "#f4eedf",
        faceInner: "#fffaf0",
        rim: "#a69a82",
        rimHighlight: "#ffffff",
        major: "#493f32",
        minor: "#a59a85",
        hourHand: "#40372d",
        minuteHand: "#70604b",
        secondHand: "#c45d4d",
        center: "#c45d4d",
        numeral: "#4d4234",
        innerRing: "rgba(94, 76, 54, 0.16)",
        glow: "rgba(196, 93, 77, 0.2)"
      }
    };

    const state = {
      showSeconds: true,
      showMarkers: true,
      showGlow: true,
      theme: "midnight",
      numerals: "arabic",
      width: 0,
      height: 0,
      dpr: 1
    };

    const romanNumerals = [
      "XII", "I", "II", "III", "IV", "V",
      "VI", "VII", "VIII", "IX", "X", "XI"
    ];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();

      if (!rect.width || !rect.height) return;

      state.width = rect.width;
      state.height = rect.height;
      state.dpr = Math.min(window.devicePixelRatio || 1, 3);

      canvas.width = Math.round(rect.width * state.dpr);
      canvas.height = Math.round(rect.height * state.dpr);

      ctx.setTransform(
        state.dpr,
        0,
        0,
        state.dpr,
        0,
        0
      );

      drawClock(new Date());
    }

    function circle(x, y, radius, fill, stroke, lineWidth = 1) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);

      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }

      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
    }

    function drawHand(angle, length, width, color, tailLength = 0) {
      const radius = state.width / 2;
      const centerX = state.width / 2;
      const centerY = state.height / 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(0, tailLength);
      ctx.lineTo(0, -length);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";

      if (state.showGlow) {
        ctx.shadowColor = themes[state.theme].glow;
        ctx.shadowBlur = width * 2.5;
      }

      ctx.stroke();
      ctx.restore();
    }

    function drawDial(theme, radius) {
      const centerX = state.width / 2;
      const centerY = state.height / 2;

      const faceGradient = ctx.createRadialGradient(
        centerX - radius * 0.24,
        centerY - radius * 0.28,
        radius * 0.08,
        centerX,
        centerY,
        radius
      );

      faceGradient.addColorStop(0, theme.faceInner);
      faceGradient.addColorStop(1, theme.face);

      circle(centerX, centerY, radius, faceGradient, theme.rim, radius * 0.025);

      circle(
        centerX,
        centerY,
        radius * 0.94,
        null,
        theme.innerRing,
        radius * 0.008
      );

      circle(
        centerX,
        centerY,
        radius * 0.89,
        null,
        theme.innerRing,
        radius * 0.004
      );

      const reflection = ctx.createRadialGradient(
        centerX - radius * 0.28,
        centerY - radius * 0.48,
        radius * 0.02,
        centerX - radius * 0.12,
        centerY - radius * 0.2,
        radius * 1.05
      );

      reflection.addColorStop(0, "rgba(255,255,255,0.075)");
      reflection.addColorStop(1, "rgba(255,255,255,0)");

      circle(centerX, centerY, radius * 0.97, reflection, null);
    }

    function drawMarkers(theme, radius) {
      const centerX = state.width / 2;
      const centerY = state.height / 2;

      for (let i = 0; i < 60; i++) {
        if (!state.showMarkers && i % 5 !== 0) continue;

        const angle = (i * Math.PI / 30) - Math.PI / 2;
        const isMajor = i % 5 === 0;

        const outerRadius = radius * 0.86;
        const innerRadius = isMajor ? radius * 0.77 : radius * 0.825;

        const x1 = centerX + Math.cos(angle) * innerRadius;
        const y1 = centerY + Math.sin(angle) * innerRadius;
        const x2 = centerX + Math.cos(angle) * outerRadius;
        const y2 = centerY + Math.sin(angle) * outerRadius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = isMajor ? theme.major : theme.minor;
        ctx.lineWidth = isMajor ? radius * 0.014 : radius * 0.0045;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }

    function drawNumerals(theme, radius) {
      if (state.numerals === "none") return;

      const centerX = state.width / 2;
      const centerY = state.height / 2;
      const numeralRadius = radius * 0.665;

      ctx.save();
      ctx.fillStyle = theme.numeral;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `600 ${radius * 0.105}px ${state.numerals === "roman" ? 'Georgia, "Times New Roman", serif' : 'system-ui, sans-serif'}`;

      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI / 6) - Math.PI / 2;
        const x = centerX + Math.cos(angle) * numeralRadius;
        const y = centerY + Math.sin(angle) * numeralRadius;

        const label = state.numerals === "roman"
          ? romanNumerals[i]
          : String(i === 0 ? 12 : i);

        ctx.fillText(label, x, y);
      }

      ctx.restore();
    }

    function drawClock(date) {
      if (!state.width || !state.height) return;

      const width = state.width;
      const height = state.height;
      const radius = Math.min(width, height) * 0.46;
      const centerX = width / 2;
      const centerY = height / 2;
      const theme = themes[state.theme];

      ctx.clearRect(0, 0, width, height);

      if (state.showGlow) {
        ctx.save();
        ctx.shadowColor = theme.glow;
        ctx.shadowBlur = radius * 0.45;
        circle(centerX, centerY, radius * 0.96, theme.face, null);
        ctx.restore();
      }

      drawDial(theme, radius);
      drawMarkers(theme, radius);
      drawNumerals(theme, radius);

      const milliseconds = date.getMilliseconds();
      const seconds = date.getSeconds() + milliseconds / 1000;
      const minutes = date.getMinutes() + seconds / 60;
      const hours = (date.getHours() % 12) + minutes / 60;

      const secondAngle = (seconds / 60) * Math.PI * 2;
      const minuteAngle = (minutes / 60) * Math.PI * 2;
      const hourAngle = (hours / 12) * Math.PI * 2;

      drawHand(
        hourAngle,
        radius * 0.48,
        radius * 0.045,
        theme.hourHand,
        radius * 0.10
      );

      drawHand(
        minuteAngle,
        radius * 0.68,
        radius * 0.028,
        theme.minuteHand,
        radius * 0.12
      );

      if (state.showSeconds) {
        drawHand(
          secondAngle,
          radius * 0.77,
          radius * 0.009,
          theme.secondHand,
          radius * 0.19
        );
      }

      circle(
        centerX,
        centerY,
        radius * 0.055,
        theme.center,
        theme.face,
        radius * 0.016
      );

      circle(
        centerX,
        centerY,
        radius * 0.018,
        theme.face,
        null
      );

      updateDigitalDisplay(date);

      canvas.setAttribute(
        "aria-label",
        `Analog clock showing ${date.toLocaleTimeString()}`
      );
    }

    function updateDigitalDisplay(date) {
      digitalTime.textContent = date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      dateDisplay.textContent = date.toLocaleDateString([], {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function animate() {
      drawClock(new Date());
      window.requestAnimationFrame(animate);
    }

    function updateToggle(button, key) {
      state[key] = !state[key];
      button.classList.toggle("active", state[key]);
      button.setAttribute("aria-pressed", String(state[key]));
    }

    themeSelect.addEventListener("change", () => {
      state.theme = themeSelect.value;
      drawClock(new Date());
    });

    numberSelect.addEventListener("change", () => {
      state.numerals = numberSelect.value;
      drawClock(new Date());
    });

    secondsToggle.addEventListener("click", () => {
      updateToggle(secondsToggle, "showSeconds");
      drawClock(new Date());
    });

    marksToggle.addEventListener("click", () => {
      updateToggle(marksToggle, "showMarkers");
      drawClock(new Date());
    });

    glowToggle.addEventListener("click", () => {
      updateToggle(glowToggle, "showGlow");
      drawClock(new Date());
    });

    if ("ResizeObserver" in window) {
      const observer = new ResizeObserver(resizeCanvas);
      observer.observe(canvas);
    } else {
      window.addEventListener("resize", resizeCanvas);
    }

    resizeCanvas();
    animate();
  </script>
</body>
</html>
